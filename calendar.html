<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interactive Calendar Tool | ToolboxTree</title>
<meta name="description" content="A free interactive calendar tool to navigate dates and plan your schedule.">
<link rel="icon" type="image/svg+xml" href="assets/logo.svg">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="css/site.css">
<style>
  .cal-wrap { max-width: 560px; margin: 0 auto; }
  .cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  .cal-head button { background: #fff; border: 1px solid var(--border-strong); border-radius: 10px; width: 38px; height: 38px; cursor: pointer; font-size: 1rem; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .cal-grid .dow { text-align: center; font-size: 0.75rem; font-weight: 700; color: var(--faint); padding-bottom: 6px; }
  .cal-grid .day { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; border-radius: 10px; font-weight: 600; cursor: pointer; font-size: 0.92rem; }
  .cal-grid .day:hover { background: var(--teal-50); }
  .cal-grid .day.muted { color: var(--faint); font-weight: 400; }
  .cal-grid .day.today { border: 2px solid var(--teal-600); }
  .cal-grid .day.selected { background: var(--teal-700); color: #fff; }
</style>
</head>
<body data-nav="calendar">
<div id="site-nav"></div>

<main class="section container">
  <div class="section-head"><h1 style="font-size:1.8rem;">Interactive Calendar Tool</h1><p>Find days of the week, and plan ahead for future or past dates.</p></div>

  <div class="cal-wrap card">
    <div class="cal-head">
      <button id="prevMonth" aria-label="Previous month">‹</button>
      <h3 id="monthLabel"></h3>
      <button id="nextMonth" aria-label="Next month">›</button>
    </div>
    <div class="cal-grid" id="calGrid"></div>
    <p class="text-center" style="margin-top:16px; color:var(--muted); font-size:0.9rem;" id="selectedInfo"></p>
  </div>
</main>

<div id="site-footer"></div>
<script src="js/include.js"></script>
<script>
let view = new Date();
let selected = new Date();

function render() {
  const y = view.getFullYear(), m = view.getMonth();
  document.getElementById('monthLabel').textContent = view.toLocaleDateString(undefined, { month: 'long', year: 'numeric' });
  const grid = document.getElementById('calGrid');
  const dows = ['Su','Mo','Tu','We','Th','Fr','Sa'];
  let html = dows.map(d => `<div class="dow">${d}</div>`).join('');

  const firstDow = new Date(y, m, 1).getDay();
  const daysInMonth = new Date(y, m + 1, 0).getDate();
  const daysInPrev = new Date(y, m, 0).getDate();
  const today = new Date();

  for (let i = firstDow - 1; i >= 0; i--) html += `<div class="day muted">${daysInPrev - i}</div>`;
  for (let d = 1; d <= daysInMonth; d++) {
    const isToday = d === today.getDate() && m === today.getMonth() && y === today.getFullYear();
    const isSel = d === selected.getDate() && m === selected.getMonth() && y === selected.getFullYear();
    html += `<div class="day ${isToday ? 'today' : ''} ${isSel ? 'selected' : ''}" data-day="${d}">${d}</div>`;
  }
  const totalCells = firstDow + daysInMonth;
  const trailing = (7 - (totalCells % 7)) % 7;
  for (let d = 1; d <= trailing; d++) html += `<div class="day muted">${d}</div>`;

  grid.innerHTML = html;
  const info = document.getElementById('selectedInfo');
  info.textContent = selected.toLocaleDateString(undefined, { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
}

document.getElementById('calGrid').addEventListener('click', e => {
  const cell = e.target.closest('.day:not(.muted)');
  if (!cell) return;
  selected = new Date(view.getFullYear(), view.getMonth(), parseInt(cell.dataset.day));
  render();
});
document.getElementById('prevMonth').addEventListener('click', () => { view.setMonth(view.getMonth() - 1); render(); });
document.getElementById('nextMonth').addEventListener('click', () => { view.setMonth(view.getMonth() + 1); render(); });
render();
</script>
</body>
</html>

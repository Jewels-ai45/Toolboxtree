<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blog | ToolboxTree</title>
<meta name="description" content="Guides and tips on getting more out of ToolboxTree's free tools.">
<link rel="icon" type="image/svg+xml" href="assets/logo.svg">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/site.css">
</head>
<body data-nav="blog">
<div id="site-nav"></div>

<main class="section container">
  <div class="section-head"><h1 style="font-size:1.9rem;">Blog</h1><p>Short, practical guides — no fluff.</p></div>
  <div class="grid" id="postGrid"></div>
</main>

<div id="site-footer"></div>
<script src="js/include.js"></script>
<script>
// All three posts are now written and live.
const posts = [
  { title: 'How to split a PDF without installing anything', excerpt: 'A quick walkthrough of ToolboxTree\'s free PDF splitter — no software, no watermark.', tag: 'PDF', href: 'blog/how-to-split-a-pdf.html' },
  { title: '5 percentage calculations everyone should know', excerpt: 'Tips, discounts, raises and more — the mental math shortcuts worth learning.', tag: 'Finance', href: 'blog/percentage-calculations-everyone-should-know.html' },
    { title: 'Time zone meeting converter — see meeting times across cities', excerpt: 'Instantly see what a meeting time looks like in New York, London, Dubai, Mumbai, Singapore and more — no sign-up, nothing sent anywhere.', tag: 'Productivity', href: 'blog/timezone-converter-meetings/' },
  { title: 'Budgeting around a loan: a simple way to plan repayments', excerpt: 'Work out your real loan repayment before you commit, then fit it into your budget with a simple framework.', tag: 'Finance', href: 'blog/financial-planning-calculator-budget/' },
{ title: 'How to use the calendar to plan holidays and time off', excerpt: 'Quick-add dates in plain English, colour-code your travel days, and pin a countdown to your next trip.', tag: 'Productivity', href: 'blog/how-to-use-holiday-calendar/' },
{ title: 'How to make a QR code for links, wifi, or text', excerpt: 'Generate a free QR code for anything, pick the right size and error-correction level, and download as PNG or SVG.', tag: 'Utility', href: 'blog/qr-code-generation-guide/' },
{ title: 'How to convert units instantly, without the mental math', excerpt: 'Length, weight, temperature and volume — pick a category, type a number, done.', tag: 'Conversion', href: 'blog/unit-converter-guide/' },

];
document.getElementById('postGrid').innerHTML = posts.map(p => `
  <div class="card tool-card">
    <span class="badge" style="align-self:flex-start; margin-bottom:14px;">${p.tag}</span>
    <h3>${p.title}</h3>
    <p>${p.excerpt}</p>
    ${p.href
      ? `<a href="${p.href}" class="btn btn-primary">Read guide</a>`
      : `<span class="btn btn-ghost" style="opacity:0.6; cursor:default;">Coming soon</span>`}
  </div>`).join('');
</script>
</body>
</html>

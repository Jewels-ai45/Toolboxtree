<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reflect — ToolboxTree Planner</title>
<meta name="description" content="A monthly check-in — see what worked and set your one change for next month.">
<link rel="icon" type="image/svg+xml" href="../assets/logo.svg">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/styles.css">
<link rel="stylesheet" href="../css/site.css">
<style>
  .habit-history { display: grid; grid-template-columns: repeat(auto-fill, minmax(20px, 1fr)); gap: 4px; margin-top: 14px; }
  .habit-history .cell { aspect-ratio: 1; border-radius: 4px; background: var(--border); }
</style>
</head>
<body data-root="../" data-nav="planner" data-planner="reflect">
<div id="site-nav"></div>

<main class="container planner-shell">
  <nav class="planner-nav" id="planner-nav"></nav>

  <div class="planner-main">
    <div class="notice"><span class="dot"></span> Your data is saved on this device. An account is optional — sign up only if you want to sync.</div>

    <h1 style="font-size:1.8rem; margin-bottom:0;">Reflect</h1>
    <p id="monthSub" style="margin-top:-4px;"></p>

    <div class="card">
      <h3>This month so far</h3>
      <div class="stat-row">
        <div class="stat-box"><div class="num" id="streakStat">0d</div><div class="lab">Habit streak</div></div>
        <div class="stat-box"><div class="num" id="prioStat">0/3</div><div class="lab">Priorities done</div></div>
        <div class="stat-box"><div class="num" id="incomeStat">$0</div><div class="lab">Income logged</div></div>
      </div>
      <p style="font-size:0.85rem; margin-top:18px; margin-bottom:4px;">Habit history (darker = more habits done that day)</p>
      <div class="habit-history" id="habitHistory"></div>
    </div>

    <div class="card">
      <h3>Two prompts</h3>
      <label style="font-weight:600; font-size:0.92rem;">What worked? Note the one or two things that actually moved you forward.</label>
      <div class="field-row"><textarea id="whatWorked" placeholder="e.g. Logging income right after each payment kept me honest."></textarea></div>
      <label style="font-weight:600; font-size:0.92rem; display:block; margin-top:16px;">What will you change? One concrete adjustment for next month.</label>
      <div class="field-row"><textarea id="whatChange" placeholder="e.g. Move deep work to mornings before email."></textarea></div>
    </div>
  </div>
</main>

<div id="site-footer"></div>
<script src="../js/include.js"></script>
<script src="../js/planner.js"></script>
<script>
document.getElementById('monthSub').textContent = new Date().toLocaleDateString(undefined, { month: 'long', year: 'numeric' });

const income = Store.get('income', []);
const month = Store.monthKey();
const monthIncome = income.filter(e => e.date.startsWith(month)).reduce((s, e) => s + e.amount, 0);
document.getElementById('incomeStat').textContent = '$' + monthIncome.toLocaleString();

const priorities = Store.get('priorities', []);
document.getElementById('prioStat').textContent = `${priorities.filter(p => p.done).length}/${priorities.length || 3}`;

// Habit streak + history from a simple per-day completion log
const habitLog = Store.get('habitLog', {}); // { '2026-08-15': 2 } completions that day
const daysInMonth = new Date(new Date().getFullYear(), new Date().getMonth() + 1, 0).getDate();
let streak = 0;
for (let d = new Date().getDate(); d >= 1; d--) {
  const key = `${month}-${String(d).padStart(2,'0')}`;
  if (habitLog[key] > 0) streak++; else break;
}
document.getElementById('streakStat').textContent = streak + 'd';

const historyEl = document.getElementById('habitHistory');
let cells = '';
for (let d = 1; d <= daysInMonth; d++) {
  const key = `${month}-${String(d).padStart(2,'0')}`;
  const count = habitLog[key] || 0;
  const shade = count === 0 ? 'var(--border)' : count === 1 ? '#a7ded4' : '#0f9488';
  cells += `<div class="cell" style="background:${shade};" title="Day ${d}: ${count} habit(s)"></div>`;
}
historyEl.innerHTML = cells;

const whatWorked = document.getElementById('whatWorked');
const whatChange = document.getElementById('whatChange');
const reflections = Store.get('reflections', {});
whatWorked.value = (reflections[month] || {}).worked || '';
whatChange.value = (reflections[month] || {}).change || '';
[whatWorked, whatChange].forEach(el => el.addEventListener('input', () => {
  reflections[month] = { worked: whatWorked.value, change: whatChange.value };
  Store.set('reflections', reflections);
}));
</script>
</body>
</html>
